name: flor-de-cacau
x-app-env: &app-env
  DATABASE_URL: postgres://flora:${DB_PASSWORD:-flora_local}@db:5432/flora
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-before-publishing}
  BETTER_AUTH_URL: http://localhost:5173
  ORIGIN: http://localhost:5173
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  APP_ENV: development
  UPLOAD_DIR: /app/uploads
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: flora
      POSTGRES_USER: flora
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flora_local}
    ports: ['127.0.0.1:55432:5432']
    volumes: ['database:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flora -d flora']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  init:
    build: { context: ., target: tools }
    environment: *app-env
    command: ['sh', '-c', 'npm run db:migrate && npm run db:seed -- --mode demo']
    depends_on: { db: { condition: service_healthy } }
  app:
    build: { context: ., target: app }
    environment: *app-env
    ports: ['127.0.0.1:5173:3000']
    volumes: ['uploads:/app/uploads']
    depends_on: { init: { condition: service_completed_successfully } }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  database:
  uploads:
